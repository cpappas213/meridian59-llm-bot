[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian59-llm-bot"
version = "0.2.0"
description = "Durable LLM controller and MCP supervision facade for m59-harness"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "tzdata>=2026.3; platform_system == 'Windows'",
]
authors = [{ name = "Meridian 59 LLM Bot contributors" }]
keywords = ["meridian-59", "llm", "game-bot", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]

[project.scripts]
m59-bot = "meridian_bot.cli:main"

[project.urls]
Homepage = "https://github.com/cpappas213/meridian59-llm-bot"
Repository = "https://github.com/cpappas213/meridian59-llm-bot.git"
Issues = "https://github.com/cpappas213/meridian59-llm-bot/issues"
Documentation = "https://github.com/cpappas213/meridian59-llm-bot/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["meridian_bot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
